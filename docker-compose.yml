version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: slateiq-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slateiq}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slateiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: slateiq-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-slateiq_local_redis_secret}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-slateiq_local_redis_secret}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: slateiq-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ROOT_USER:-slateiq_admin}
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD:-slateiq_local_s3_secret}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-41-28Z
    container_name: slateiq-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${S3_ROOT_USER:-slateiq_admin} ${S3_ROOT_PASSWORD:-slateiq_local_s3_secret};
      /usr/bin/mc mb --ignore-existing local/${S3_BUCKET_QUARANTINE:-slq-local-in-evidence-quarantine};
      /usr/bin/mc mb --ignore-existing --with-lock local/${S3_BUCKET_EVIDENCE:-slq-local-in-evidence};
      /usr/bin/mc mb --ignore-existing local/${S3_BUCKET_IMPORTS:-slq-local-in-imports};
      /usr/bin/mc mb --ignore-existing --with-lock local/${S3_BUCKET_AUDIT_ARCHIVE:-slq-local-in-audit-archive};
      echo 'MinIO buckets initialized successfully.';
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
