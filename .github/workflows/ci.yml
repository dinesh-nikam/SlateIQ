name: SlateIQ CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  validate-contracts:
    name: Validate Contracts & Catalogues (ADR-066)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Contract Validator
        run: node ./scripts/validate-contracts.js

  web-build:
    name: Web Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm --prefix web ci

      - name: Build Application
        run: npm --prefix web run build

  backend-build:
    name: Backend Build & Domain Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/SlateIQ.sln

      - name: Build Solution
        run: dotnet build backend/SlateIQ.sln --no-restore -c Release

      - name: Execute Tests
        run: dotnet test backend/SlateIQ.sln --no-build -c Release --verbosity normal

  database-migrations-lint:
    name: Validate Database Migrations & RLS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Migration Files
        run: |
          test -f infra/migrations/001_initial_foundation_tenancy_identity_ops_compliance.sql
          test -f infra/migrations/002_seed_canonical_roles_and_permissions.sql
          test -f infra/migrations/003_ops_provisioning_run.sql
          test -f infra/migrations/004_production_and_budgeting.sql
          echo "Verified migration files present."

      - name: Verify Row Level Security Policies
        run: node ./scripts/verify-rls.js
